<noscript><p style="padding:30px">This little arcade needs JavaScript to turn your choices into a ticket. No account is needed.</p></noscript>
<script id="wonder-engine">
/* Pure, dependency-free content engine. No inference, profiling, API, or prediction model. */
(function(root){
'use strict';
const VERSION=1;
const doors=[
{id:'begin',name:'A fresh start',hint:'For the thing waiting to begin.',icon:'door',title:'The door is smaller than you think.',observation:'You chose a fresh start. This ticket offers a small beginning, rather than a grand reinvention.',same:'Another round of preparation could keep the beginning comfortably out of reach.',different:'One small, unfinished attempt could give you something real to build on.',action:'Spend ten minutes making the smallest version of something you have been meaning to begin. Leave the polish for another day.'},
{id:'courage',name:'A little courage',hint:'For the step that feels a little big.',icon:'sun',title:'Courage can use its indoor voice.',observation:'You chose courage. Consider whether the next step needs a dramatic announcement, or simply a quiet attempt.',same:'Waiting to feel completely ready could keep the same question waiting beside you.',different:'A small, reversible step could turn a vague worry into something you can learn from.',action:'Write down one low-stakes thing you have been putting off. Give it ten minutes, with permission to stop afterward.'},
{id:'connection',name:'More connection',hint:'For the people who matter.',icon:'thread',title:'A small hello can make a large room.',observation:'You chose connection. This ticket invites you to notice one relationship you would enjoy giving a little attention.',same:'A good intention left unsent may remain a conversation only you have had.',different:'A kind, low-pressure hello could open a little space for a real exchange. A reply is never owed.',action:'Send a simple, specific thank-you to someone you appreciate. No favor, no pitch, and no expectation of an immediate reply.'},
{id:'space',name:'Room to breathe',hint:'For a little less of everything.',icon:'moon',title:'Not every empty space needs filling.',observation:'You chose breathing room. Imagine leaving one small piece of your day unclaimed, without asking it to become productive.',same:'Filling every gap could leave little space to notice what you actually enjoy.',different:'A small pause could make one next choice feel less crowded.',action:'Set aside ten minutes without adding a task. Look out a window, sit somewhere pleasant, or take a gentle stroll if that suits you.'}
];
const moods=[
{id:'full',name:'My mind is full',hint:'Too many tabs. Some of them are imaginary.',line:'You also chose a full mind; keep the experiment to one thing, not a new list.'},
{id:'waiting',name:'I am waiting for a sign',hint:'Preferably one with very clear lettering.',line:'You chose waiting for a sign. Treat this as an invitation to experiment, not an instruction from the universe.'},
{id:'ready',name:'I am ready for something',hint:'The exact something is still negotiating.',line:'You chose readiness. Give that energy one modest, reversible place to land.'},
{id:'curious',name:'I am just curious',hint:'A perfectly respectable reason to be here.',line:'You came out of curiosity. Keep whatever amuses you and leave the rest in the machine.'}
];
const charms=[
{id:'key',name:'Brass key',hint:'For opening, not forcing.',icon:'key',line:'Your brass key: a small opening is still an opening.',twist:'Make your first move small enough to undo.'},
{id:'moon',name:'Paper moon',hint:'For the beautifully unfinished.',icon:'moon',line:'Your paper moon: even a rough draft can give a little light.',twist:'Let the result be imperfect on purpose.'},
{id:'compass',name:'Little compass',hint:'For a direction, not a deadline.',icon:'compass',line:'Your little compass: direction counts, even before distance does.',twist:'Notice what you learned, rather than how far you got.'},
{id:'pebble',name:'Lucky pebble',hint:'No magic. Excellent pocket manners.',icon:'pebble',line:'Your lucky pebble: ordinary things can become good reminders.',twist:'Choose an ordinary object as a reminder of your small adventure.'}
];
function pick(collection,id,label){const value=collection.find(item=>item.id===id);if(!value)throw new Error('Choose a valid '+label+'.');return value;}
function hash(text){let h=2166136261;for(let i=0;i<text.length;i++){h^=text.charCodeAt(i);h=Math.imul(h,16777619);}return(h>>>0).toString(36).toUpperCase().padStart(7,'0');}
function makeTicket(selection,date=new Date()){
const d=pick(doors,selection.door,'door'),m=pick(moods,selection.mood,'feeling'),c=pick(charms,selection.charm,'charm');
const stamp=new Date(date);if(!Number.isFinite(stamp.getTime()))throw new Error('Invalid date.');
return{version:VERSION,id:hash([d.id,m.id,c.id,stamp.toISOString()].join('|')),createdAt:stamp.toISOString(),door:d.id,mood:m.id,charm:c.id,doorName:d.name,charmName:c.name,title:d.title,observation:d.observation+' '+m.line,same:d.same,different:d.different,action:d.action+' '+c.twist,charmLine:c.line,disclaimer:'A playful reflection, not a prediction. Your choices are still yours.'};
}
function validTicket(t){return !!t&&t.version===VERSION&&typeof t.id==='string'&&/^[A-Z0-9]{7}$/.test(t.id)&&Number.isFinite(Date.parse(t.createdAt))&&doors.some(d=>d.id===t.door)&&moods.some(m=>m.id===t.mood)&&charms.some(c=>c.id===t.charm)&&['title','observation','same','different','action','charmLine','doorName','charmName','disclaimer'].every(k=>typeof t[k]==='string'&&t[k].length>0&&t[k].length<=2000);}
function escapeHTML(value){return String(value).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));}
function ticketText(t){if(!validTicket(t))throw new Error('Invalid ticket.');return['THE WONDER TICKET · Grandpa Kasmer','Ticket '+t.id,'',t.title,'',t.observation,'','If the pattern continues',t.same,'','A different possibility',t.different,'','Your ten-minute adventure',t.action,'',t.charmLine,'',t.disclaimer].join('\n');}
function readTickets(storage){try{const raw=storage.getItem('wonder-ticket:v1');if(!raw)return[];if(raw.length>200000)return[];const parsed=JSON.parse(raw);if(!Array.isArray(parsed))return[];const seen=new Set();return parsed.filter(t=>{if(!validTicket(t)||seen.has(t.id))return false;seen.add(t.id);return true;}).slice(0,20);}catch{return[];}}
function saveTicket(storage,ticket){if(!validTicket(ticket))return{ok:false,reason:'invalid'};try{const tickets=readTickets(storage),already=tickets.some(t=>t.id===ticket.id);storage.setItem('wonder-ticket:v1',JSON.stringify([ticket,...tickets.filter(t=>t.id!==ticket.id)].slice(0,20)));return{ok:true,already};}catch{return{ok:false,reason:'unavailable'};}}
function deleteTicket(storage,id){try{storage.setItem('wonder-ticket:v1',JSON.stringify(readTickets(storage).filter(t=>t.id!==id)));return true;}catch{return false;}}
root.WonderEngine=Object.freeze({VERSION,doors,moods,charms,makeTicket,validTicket,escapeHTML,ticketText,readTickets,saveTicket,deleteTicket});
})(globalThis);
</script>
<script>
(function(){
'use strict';
const E=globalThis.WonderEngine,esc=E.escapeHTML,main=document.getElementById('main'),dialog=document.getElementById('dialog');
const state={screen:'home',step:0,door:null,mood:null,charm:null,ticket:null,sound:false,busy:false};
let toastTimer,brewTimer,audioContext;
const icons={door:'<path d="M8 27V12a8 8 0 0 1 16 0v15M5 27h22M13 27V13l8-3v17M17 19h.1"/>',sun:'<circle cx="16" cy="16" r="6"/><path d="M16 2v4m0 20v4M2 16h4m20 0h4M6 6l3 3m14 14 3 3M6 26l3-3M23 9l3-3"/>',thread:'<path d="M18 8c-8-6-15 5-9 10l5 4m0-14c8-6 15 5 9 10l-5 4M11 16l5 5 5-5"/>',moon:'<path d="M23 22A11 11 0 0 1 12 4a12 12 0 1 0 11 18Z"/><path d="m23 5 1 3 3 1-3 1-1 3-1-3-3-1 3-1Z"/>',key:'<circle cx="11" cy="11" r="6"/><path d="m15 15 12 12m-5-5 4-4m-8 0 4-4"/>',compass:'<circle cx="16" cy="16" r="12"/><path d="m21 11-3 7-7 3 3-7Z"/>',pebble:'<path d="M7 10c4-7 14-6 19 3s-1 15-11 13S2 19 7 10Z"/><path d="M9 12c2-3 5-4 8-3"/>'};
function icon(name){return '<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(icons[name]||icons.sun)+'</svg>';}
const arrow='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4 12h15m-5-5 5 5-5 5"/></svg>';
function storage(){try{return window.localStorage;}catch{return{getItem(){return null;},setItem(){throw new Error('Storage unavailable');}};}}
function notify(text){clearTimeout(toastTimer);const el=document.getElementById('toast');el.textContent=text;el.hidden=false;toastTimer=setTimeout(()=>{el.hidden=true;},4500);}
function nativeMessage(type,payload={}){const handler=window.webkit?.messageHandlers?.wonderTicket;if(!handler)return false;try{handler.postMessage({type,...payload});return true;}catch{return false;}}
function tone(){if(!state.sound)return;try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;audioContext=audioContext||new AC();audioContext.resume();[523.25,659.25,783.99].forEach((freq,i)=>{const o=audioContext.createOscillator(),g=audioContext.createGain();o.type='sine';o.frequency.value=freq;const t=audioContext.currentTime+i*.11;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.055,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.65);o.connect(g);g.connect(audioContext.destination);o.start(t);o.stop(t+.7);});}catch{/* Sound is optional. */}}
function updateCount(){document.getElementById('saved-count').textContent=E.readTickets(storage()).length;}
function render(focus=true){updateCount();if(state.screen==='home')renderHome();else if(state.screen==='journey')renderJourney();else if(state.screen==='brewing')renderBrewing();else renderTicket();if(focus){main.focus({preventScroll:true});window.scrollTo({top:0,behavior:'instant'});}}
function renderHome(){main.innerHTML=`<section class="hero"><div class="hero-copy"><div class="eyebrow"><span>✦</span> A tiny arcade for life's possibilities</div><h1>A little wonder.<br>A ticket to<br><em>what's next.</em></h1><p class="lead">Choose a door. Carry a charm.<br>Let Grandpa Kasmer hand you a curious little reflection—and a small adventure worth trying.</p><button class="primary" data-action="begin">Find my wonder ticket ${arrow}</button><p class="small-note">No coins required <span>·</span> About a minute <span>·</span> Just for you</p><div class="hero-notice">“The future is a work in progress.<br>Luckily, so are we.”<small>— Grandpa Kasmer</small></div></div><div class="machine-scene" role="img" aria-label="An old-fashioned green and brass fortune machine with a glowing crystal ball and a paper ticket"><div class="halo"></div><span class="scene-star s1">✧</span><span class="scene-star s2">✦</span><span class="scene-star s3">✧</span><span class="scene-star s4">✦</span><div class="machine"><div class="machine-top-star">✧</div><div class="machine-label">THE WONDER TICKET</div><div class="glass"><div class="orb"></div><span class="star">✦</span><span class="star">✧</span></div><div class="machine-motto">A fortune you help write.</div><div class="slot"></div><div class="mini-ticket"><small>ONE SMALL POSSIBILITY</small><strong>Something good<br>can start small.</strong><i>✦</i><div class="ticket-line"></div></div><div class="lever"><div class="knob"></div></div><div class="base-dots"><i></i><i></i><i></i></div></div><div class="machine-caption">Est. whenever you needed a little wonder</div></div></section><section class="intro-strip" aria-label="How it works"><div><b>01</b><span><strong>Follow your curiosity</strong><span>Choose what calls to you.</span></span></div><div><b>02</b><span><strong>Take a little charm</strong><span>Something to carry forward.</span></span></div><div><b>03</b><span><strong>Make a little room</strong><span>For a possibility of your own.</span></span></div></section><p class="local-note">Hand-written reflections shaped by your choices. Not AI predictions or professional advice.</p>`;}
function steps(){return '<ol class="steps" aria-label="Your journey">'+['A door','A feeling','A charm'].map((label,i)=>'<li class="'+(state.step===i?'current':'')+'"'+(state.step===i?' aria-current="step"':'')+'><span class="step-num">'+(i<state.step?'✓':i+1)+'</span>'+label+'</li>'+(i<2?'<li class="step-line" aria-hidden="true"></li>':'')).join('')+'</ol>';}
function renderJourney(){const collection=[E.doors,E.moods,E.charms][state.step],key=['door','mood','charm'][state.step],titles=['Which door calls to you?','What feels familiar today?','Take something for the road.'],subtitles=['There is no wrong door. Just a place to begin.','No deep secrets required. A little honesty will do.','Not magic. Just a good reminder in your pocket.'];main.innerHTML='<section class="journey">'+steps()+'<div class="journey-title"><div class="eyebrow">'+['Follow your curiosity','A moment with yourself','One small keepsake'][state.step]+'</div><h1>'+titles[state.step]+'</h1><p>'+subtitles[state.step]+'</p></div><div class="choices '+(state.step===1?'mood-grid':'')+'" role="group" aria-label="'+titles[state.step]+'">'+collection.map(c=>'<button class="choice" data-choice="'+c.id+'" aria-pressed="'+(state[key]===c.id)+'">'+(c.icon?'<span class="art">'+icon(c.icon)+'</span>':'')+'<b>'+esc(c.name)+'</b><small>'+esc(c.hint)+'</small><span class="selected-tick" aria-hidden="true">✓</span></button>').join('')+'</div><p class="selection-note" aria-live="polite">'+(state[key]?'A good choice. Let’s see where it leads.':'Choose one to continue.')+'</p><div class="journey-actions"><button class="back" data-action="back">← '+(state.step?'Go back':'Back to the arcade')+'</button><button id="next-button" class="primary" data-action="next" '+(!state[key]?'disabled':'')+'>'+(state.step===2?'Pull the lever':'Carry on')+' '+arrow+'</button></div></section>';}
function renderBrewing(){main.innerHTML='<section class="brewing" aria-live="polite" aria-busy="true"><div class="orb" aria-hidden="true"></div><div class="eyebrow">One small possibility, coming up</div><h2>The machine is thinking small.</h2><p>Good things do not always make a grand entrance.</p></section>';}
function renderTicket(){const t=state.ticket;if(!E.validTicket(t)){state.screen='home';renderHome();return;}const saved=E.readTickets(storage()).some(x=>x.id===t.id);main.innerHTML=`<section class="result reveal-in"><div class="result-header"><div class="eyebrow">The machine has a little something for you</div><h1>One ticket. A few possibilities.</h1></div><article class="ticket" aria-label="Your wonder ticket"><div class="ticket-top"><div><div class="ticket-brand">THE WONDER TICKET</div><div class="ticket-number">GRANDPA KASMER · NO. ${esc(t.id)}</div></div><span class="ticket-stamp" aria-hidden="true">✦</span></div><div class="eyebrow">Through the door of ${esc(t.doorName.toLowerCase())}</div><h2>${esc(t.title)}</h2><p class="ticket-observation">${esc(t.observation)}</p><div class="paths"><div><h3>If the pattern continues</h3><p>${esc(t.same)}</p></div><div><h3>A different possibility</h3><p>${esc(t.different)}</p></div></div><div class="adventure"><h3>✧ Your ten-minute adventure</h3><p>${esc(t.action)}</p></div><p class="charm-line">${esc(t.charmLine)}</p><div class="ticket-footer"><span>${esc(t.disclaimer)}</span><strong>KEEP A LITTLE WONDER.</strong></div></article><div class="result-actions"><button class="secondary" data-action="save">${saved?'Saved on this device':'Save my ticket'}</button><button class="secondary" data-action="share">Share my ticket ↗</button><button class="secondary" data-action="image">Save an image ↓</button><button class="secondary" data-action="copy">Copy the words</button></div><p class="local-note">Saving keeps up to 20 tickets on this device only. Nothing is sent to a reading service.</p><div class="result-bottom"><button class="back" data-action="begin">← Visit another door</button><button class="quiet" data-action="saved">Open my tickets</button></div></section>`;}
function showDialog(title,html){document.getElementById('dialog-title').textContent=title;document.getElementById('dialog-body').innerHTML=html;if(!dialog.open)dialog.showModal();}
function showSaved(){const tickets=E.readTickets(storage());showDialog('Your little collection',tickets.length?'<p>Kept on this device, not in an account. Save a copy before clearing browser data.</p>'+tickets.map(t=>'<div class="saved-item"><button class="saved-open" data-open-ticket="'+esc(t.id)+'"><strong>'+esc(t.title)+'</strong><small>'+esc(new Date(t.createdAt).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}))+' · '+esc(t.charmName)+'</small></button><button class="delete" data-delete-ticket="'+esc(t.id)+'" aria-label="Delete ticket '+esc(t.id)+'">Delete</button></div>').join(''):'<div class="empty-note"><p>No tickets tucked away yet.</p><p>After a reading, choose <strong>Save my ticket</strong> to keep it here.</p></div>');}
function begin(){clearTimeout(brewTimer);Object.assign(state,{screen:'journey',step:0,door:null,mood:null,charm:null,ticket:null,busy:false});render();}
async function copyTicket(){const text=E.ticketText(state.ticket);try{if(!navigator.clipboard?.writeText)throw new Error('Clipboard unavailable');await navigator.clipboard.writeText(text);notify('Your ticket’s words are copied.');}catch{showDialog('Keep the words','<p>Automatic copying is unavailable here. Select and copy your ticket below.</p><textarea id="copy-text" class="copy-box" readonly aria-label="Ticket text">'+esc(text)+'</textarea>');const box=document.getElementById('copy-text');box.focus();box.select();}}
async function shareTicket(){const text=E.ticketText(state.ticket);if(nativeMessage('share',{text}))return;try{if(navigator.share){await navigator.share({title:'My Wonder Ticket',text});return;}}catch(e){if(e.name==='AbortError')return;}await copyTicket();}
function makeImage(ticket){const width=1080,margin=94,canvas=document.createElement('canvas'),ctx=canvas.getContext('2d');if(!ctx)throw new Error('Canvas unavailable');canvas.width=width;canvas.height=1800;const blocks=[];let y=95;function textBlock(text,font,size,color,spacing=1.48){ctx.font=font;const lines=[];let line='';for(const word of text.split(/\s+/)){const trial=line?line+' '+word:word;if(ctx.measureText(trial).width>width-margin*2&&line){lines.push(line);line=word;}else line=trial;}if(line)lines.push(line);blocks.push({lines,font,size,color,y,spacing});y+=lines.length*size*spacing;}
textBlock('THE WONDER TICKET · GRANDPA KASMER','600 23px sans-serif',23,'#536544');y+=45;textBlock(ticket.title,'54px Georgia',54,'#243d35',1.13);y+=32;textBlock(ticket.observation,'29px Georgia',29,'#243d35',1.5);y+=30;for(const[label,text]of[['IF THE PATTERN CONTINUES',ticket.same],['A DIFFERENT POSSIBILITY',ticket.different],['YOUR TEN-MINUTE ADVENTURE',ticket.action]]){textBlock(label,'600 20px sans-serif',20,'#765a27');y+=10;textBlock(text,'25px sans-serif',25,'#243d35');y+=27;}textBlock(ticket.charmLine,'italic 27px Georgia',27,'#486044');y+=30;textBlock(ticket.disclaimer,'19px sans-serif',19,'#536544');y+=14;textBlock('Ticket '+ticket.id+' · grandpakasmer.com','18px sans-serif',18,'#536544');canvas.height=Math.ceil(y+75);ctx.fillStyle='#f1e7d2';ctx.fillRect(0,0,width,canvas.height);ctx.strokeStyle='#a2aa84';ctx.lineWidth=2;ctx.strokeRect(37,37,width-74,canvas.height-74);ctx.textBaseline='top';for(const b of blocks){ctx.font=b.font;ctx.fillStyle=b.color;b.lines.forEach((line,i)=>ctx.fillText(line,margin,b.y+i*b.size*b.spacing));}return canvas;}
function saveImage(){try{const canvas=makeImage(state.ticket),data=canvas.toDataURL('image/png');if(nativeMessage('image',{data}))return;const link=document.createElement('a');link.href=data;link.download='wonder-ticket-'+state.ticket.id+'.png';document.body.append(link);link.click();link.remove();notify('Your ticket image is ready to save.');}catch{notify('The image could not be created. Try Copy the words instead.');}}
document.addEventListener('click',async event=>{const button=event.target.closest('button,a[data-action]');if(!button)return;const choice=button.dataset.choice;if(choice&&state.screen==='journey'){state[['door','mood','charm'][state.step]]=choice;document.querySelectorAll('[data-choice]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.choice===choice)));document.getElementById('next-button').disabled=false;document.querySelector('.selection-note').textContent='A good choice. Let’s see where it leads.';return;}
if(button.dataset.openTicket){const t=E.readTickets(storage()).find(t=>t.id===button.dataset.openTicket);if(t){dialog.close();state.ticket=t;state.screen='result';render();}return;}
if(button.dataset.deleteTicket){const ok=E.deleteTicket(storage(),button.dataset.deleteTicket);updateCount();showSaved();notify(ok?'Ticket removed from this device.':'This browser could not update saved tickets.');return;}
const action=button.dataset.action;if(!action)return;event.preventDefault();switch(action){
case'home':clearTimeout(brewTimer);state.busy=false;state.screen='home';render();break;
case'begin':begin();break;
case'back':if(state.step>0){state.step--;render();}else{state.screen='home';render();}break;
case'next':if(state.busy||!state[['door','mood','charm'][state.step]])return;if(state.step<2){state.step++;render();}else{try{state.ticket=E.makeTicket(state);}catch{notify('Please choose a door, feeling, and charm first.');return;}state.busy=true;state.screen='brewing';tone();nativeMessage('haptic');render();brewTimer=setTimeout(()=>{state.busy=false;state.screen='result';render();},window.matchMedia('(prefers-reduced-motion: reduce)').matches?80:1250);}break;
case'save':{if(!state.ticket)return;const result=E.saveTicket(storage(),state.ticket);updateCount();button.textContent=result.ok?'Saved on this device':'Save my ticket';notify(result.ok?(result.already?'This ticket is already in your collection.':'Ticket tucked away on this device.'):'Saving is unavailable in this browser. Copy or save an image instead.');break;}
case'saved':showSaved();break;
case'close-dialog':dialog.close();break;
case'copy':if(state.ticket)await copyTicket();break;
case'share':if(state.ticket)await shareTicket();break;
case'image':if(state.ticket)saveImage();break;
case'sound':state.sound=!state.sound;button.setAttribute('aria-pressed',String(state.sound));button.setAttribute('aria-label',state.sound?'Disable sound':'Enable sound');button.querySelector('.sound-label').textContent=state.sound?'Sound on':'Sound off';tone();break;
case'about':showDialog('A fortune you help write.','<p>Welcome to Grandpa Kasmer’s little corner of possibility.</p><p>Choose a door, a feeling, and a charm. You’ll get a hand-written reflection, two possible paths, and a small adventure you can try—or cheerfully ignore.</p><h3>A little theater. No secret powers.</h3><p>This release combines scripted passages based only on your selections. It does not use AI, read your mind, access your accounts, or predict future events. There are no accuracy scores, hidden personal profiles, or paid upgrades.</p><h3>Keep what speaks to you.</h3><p>Tickets are for entertainment and reflection, not medical, legal, financial, or other professional advice. You remain the author of what happens next.</p><p>Created by Kasmer One LLC. <a href="mailto:hello@kasmerone.com">Say hello.</a></p>');break;
}});
window.addEventListener('storage',updateCount);
render(false);

if('serviceWorker'in navigator&&/^https?:$/.test(location.protocol)&&!window.webkit?.messageHandlers?.wonderTicket){navigator.serviceWorker.register('./sw.js').catch(()=>{/* The main experience does not depend on offline caching. */});}
})();
